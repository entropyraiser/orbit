<!doctype html>
<html lang="en" data-theme="dark" data-tint="none" data-font="rounded" data-size="md">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Personal localhost watchlist for stocks, indices, FX, crypto and commodities." />
    <title>Orbit · Global watchlist</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='12' fill='%2316181d'/><ellipse cx='20' cy='20' rx='13' ry='6.2' fill='none' stroke='%23eef0f3' stroke-width='1.7' transform='rotate(-28 20 20)'/><circle cx='20' cy='20' r='2.7' fill='%23eef0f3'/><circle cx='30.4' cy='13.6' r='2.15' fill='%23eef0f3'/></svg>" />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("watcher:v1") || "{}").state || {};
        var t = s.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.tint = s.tint || "none";
        document.documentElement.dataset.font = s.font || "rounded";
        document.documentElement.dataset.size = s.size || "md";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
        document.documentElement.dataset.tint = "none";
        document.documentElement.dataset.font = "rounded";
        document.documentElement.dataset.size = "md";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
