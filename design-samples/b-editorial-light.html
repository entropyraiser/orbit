<!doctype html><meta charset="utf-8"><title>B · Editorial Light</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:ui-sans-serif,-apple-system,Inter,sans-serif;background:#f6f3ee;color:#1b1a17;min-height:100vh;padding:28px 40px}
.serif{font-family:"Iowan Old Style","Charter",Georgia,serif}
.top{display:flex;align-items:baseline;gap:28px;border-bottom:1px solid #1b1a1722;padding-bottom:16px}
.top .brand{font-size:24px;font-style:italic}.top .s{margin-left:auto;font-size:13px;color:#7a766c;border-bottom:1px solid #1b1a1733;padding:2px 40px 2px 0}
.tape{display:flex;gap:30px;padding:12px 0;border-bottom:1px solid #1b1a1722;font-size:12.5px;overflow:hidden;white-space:nowrap}.tape span{color:#7a766c}
.up{color:#2f7d4f}.dn{color:#b8412f}
.grid{display:grid;grid-template-columns:330px 1fr;gap:56px;margin-top:26px}
.tabs{display:flex;gap:18px;font-size:13px;color:#7a766c;margin-bottom:10px}.tabs .on{color:#1b1a17;border-bottom:2px solid #1b1a17;padding-bottom:4px}
.row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #1b1a1714}.row.on{background:linear-gradient(90deg,#1b1a1708,transparent);margin:0 -10px;padding:13px 10px}
.row b{font-size:14px;display:block}.row small{font-size:11.5px;color:#7a766c}.row .m{flex:1}.row .p{text-align:right;font-size:14px}.row .p small{display:block}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7a766c}
h1{font-size:40px;font-weight:400;margin:8px 0 6px;letter-spacing:-.01em}
.price{font-size:84px;line-height:1;letter-spacing:-.03em;margin-top:14px}
.ranges{display:flex;gap:22px;margin:22px 0 8px;font-size:13px;color:#7a766c}.ranges .on{color:#1b1a17;border-bottom:2px solid #1b1a17;padding-bottom:3px}
svg.big{width:100%;height:290px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;border-top:1px solid #1b1a1722;padding-top:14px;margin-top:6px}.stats div{font-size:11px;color:#7a766c;letter-spacing:.08em;text-transform:uppercase}.stats b{display:block;font-size:17px;color:#1b1a17;letter-spacing:0;text-transform:none;font-weight:500;margin-top:4px}
</style>
<div class="top"><span class="brand serif">Watcher</span><span style="font-size:12px;color:#7a766c">Tuesday, 20 October</span><span class="s">Search the world's markets…</span></div>
<div class="tape" id="tape"></div>
<div class="grid"><div><div class="tabs"><span class="on">Global</span><span>Macro</span><span>+ New</span></div><div id="rows"></div></div>
<div><div class="eyebrow">AAPL · NASDAQ · Pre-market</div><h1 class="serif">Apple Inc.</h1>
<div class="price serif">342.94</div><div class="dn" style="margin-top:10px;font-size:15px">−0.52 &nbsp;(−0.15%) <span style="color:#7a766c">today</span></div>
<div class="ranges"><span class="on">1D</span><span>1W</span><span>1M</span><span>1Y</span><span>YTD</span><span>5Y</span><span>MAX</span></div>
<svg class="big" id="big" viewBox="0 0 800 290" preserveAspectRatio="none"></svg>
<div class="stats"><div>Open<b>340.98</b></div><div>Day range<b>340.1 – 346.0</b></div><div>52-wk range<b>243 – 348</b></div><div>Market cap<b>5.00T</b></div></div></div></div>
<script src="shared.js"></script><script>
tape.innerHTML=INDEX.map(i=>`<div>${i[0]} <span>${i[1]}</span> <b class="${i[2]>0?'up':'dn'}" style="font-weight:500">${sgn(i[2])}</b></div>`).join('');
rows.innerHTML=WATCH.map((w,i)=>{const c=w.pct>=0?'#2f7d4f':'#b8412f';return`<div class="row ${i?'':'on'}"><div class="m"><b>${w.sym}</b><small>${w.name}</small></div><svg width="56" height="22"><path d="${path(series(w.seed,50,w.d),56,22,3)}" fill="none" stroke="${c}" stroke-width="1.3"/></svg><div class="p">${fmt(w.price)}<small class="${w.pct>=0?'up':'dn'}">${sgn(w.pct)}</small></div></div>`}).join('');
const s=series(3,120,-.02);big.innerHTML=`<line x1="0" x2="800" y1="145" y2="145" stroke="#1b1a1730" stroke-dasharray="3 4"/><path d="${path(s,800,290,16)}" fill="none" stroke="#b8412f" stroke-width="1.8" stroke-linejoin="round"/>`;
</script>
