<!doctype html><meta charset="utf-8"><title>A · Midnight Glass</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:ui-sans-serif,-apple-system,"SF Pro Display",Inter,sans-serif;color:#eaeefc;min-height:100vh;padding:24px;
 background:radial-gradient(900px 500px at 15% -10%,#3b2a8c55,transparent),radial-gradient(800px 500px at 100% 10%,#0ea5e944,transparent),#070914}
.top{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#7c5cff,#22d3ee);box-shadow:0 0 24px #7c5cff88}
.search{flex:1;max-width:460px;margin:auto;padding:11px 16px;border-radius:14px;background:#ffffff0d;border:1px solid #ffffff14;color:#8d94b8;font-size:14px;backdrop-filter:blur(14px)}
.chips{display:flex;gap:10px;margin-bottom:18px;overflow:hidden}
.chip{padding:11px 16px;border-radius:16px;background:#ffffff09;border:1px solid #ffffff12;min-width:150px;backdrop-filter:blur(14px)}
.chip small{color:#8d94b8;font-size:11px;letter-spacing:.04em;text-transform:uppercase}.chip div{display:flex;justify-content:space-between;margin-top:4px;font-size:14px;font-weight:600}
.up{color:#4ade80}.dn{color:#fb7185}
.grid{display:grid;grid-template-columns:350px 1fr;gap:18px}
.card{border-radius:24px;background:linear-gradient(180deg,#ffffff0f,#ffffff06);border:1px solid #ffffff14;backdrop-filter:blur(20px);box-shadow:0 20px 60px #0008}
.list{padding:12px}.tabs{display:flex;gap:6px;padding:6px 6px 12px}.tab{padding:6px 14px;border-radius:99px;font-size:12px;color:#8d94b8}.tab.on{background:linear-gradient(135deg,#7c5cff,#5b8cff);color:#fff;box-shadow:0 4px 16px #7c5cff66}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:16px}.row.on{background:#ffffff12;box-shadow:inset 0 0 0 1px #ffffff18}
.row b{display:block;font-size:14px}.row small{color:#8d94b8;font-size:12px}.row .m{flex:1;min-width:0}.row .p{text-align:right;font-size:14px;font-weight:600}.row .p small{display:block;font-weight:500}
.main{padding:30px}.sym{font-size:12px;color:#a5b0ff;letter-spacing:.08em}
h1{font-size:28px;font-weight:600;margin:6px 0 18px;letter-spacing:-.02em}
.price{font-size:60px;font-weight:600;letter-spacing:-.04em;background:linear-gradient(180deg,#fff,#aab4ff);-webkit-background-clip:text;color:transparent}
.ranges{display:flex;gap:4px;padding:4px;border-radius:14px;background:#ffffff0d;width:max-content;margin:18px 0}.ranges span{padding:6px 12px;border-radius:10px;font-size:12px;color:#8d94b8}.ranges .on{background:#ffffff1f;color:#fff}
svg.big{width:100%;height:300px;filter:drop-shadow(0 0 12px #fb718566)}
</style>
<div class="top"><div class="logo"></div><b style="font-size:17px">Watcher</b><div class="search">⌕ &nbsp;Search &amp; add assets</div></div>
<div class="chips" id="chips"></div>
<div class="grid"><div class="card list"><div class="tabs"><span class="tab on">Global</span><span class="tab">Macro</span><span class="tab">+</span></div><div id="rows"></div></div>
<div class="card main"><div class="sym">AAPL · NASDAQ</div><h1>Apple Inc.</h1><div class="price">342.94</div><div class="dn" style="font-weight:600;margin-top:4px">−0.52 (−0.15%) <span style="color:#8d94b8;font-weight:400">Today</span></div>
<div class="ranges"><span class="on">1D</span><span>1W</span><span>1M</span><span>1Y</span><span>YTD</span><span>5Y</span><span>MAX</span></div>
<svg class="big" id="big" viewBox="0 0 800 300" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fb7185" stop-opacity=".35"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></linearGradient></defs></svg></div></div>
<script src="shared.js"></script><script>
chips.innerHTML=INDEX.map(i=>`<div class="chip"><small>${i[0]}</small><div><span>${i[1]}</span><span class="${i[2]>0?'up':'dn'}">${sgn(i[2])}</span></div></div>`).join('');
rows.innerHTML=WATCH.map((w,i)=>{const c=w.pct>=0?'#4ade80':'#fb7185';return`<div class="row ${i?'':'on'}"><div class="m"><b>${w.sym}</b><small>${w.name}</small></div><svg width="64" height="26"><path d="${path(series(w.seed,50,w.d),64,26,3)}" fill="none" stroke="${c}" stroke-width="1.6"/></svg><div class="p">${fmt(w.price)}<small class="${w.pct>=0?'up':'dn'}">${sgn(w.pct)}</small></div></div>`}).join('');
const s=series(3,120,-.02),p=path(s,800,300,20);big.innerHTML+=`<path d="${p}L800,300L0,300Z" fill="url(#g)"/><path d="${p}" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linejoin="round"/>`;
</script>
