<!doctype html><meta charset="utf-8"><title>D · Neon Lime</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:"SF Pro Rounded",ui-rounded,ui-sans-serif,-apple-system,Inter,sans-serif;background:#0b0b0f;color:#f4f4f6;padding:22px;min-height:100vh}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.logo{font-weight:900;font-size:22px;letter-spacing:-.04em}.logo i{color:#c6ff3d;font-style:normal}
.search{margin-left:auto;background:#17171d;border-radius:99px;padding:11px 22px;color:#7d7d89;font-size:14px;width:340px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#c6ff3d,#3dffb0)}
.chips{display:flex;gap:10px;margin-bottom:18px;overflow:hidden}
.chip{background:#17171d;border-radius:22px;padding:12px 16px;min-width:158px}.chip small{color:#7d7d89;font-size:12px;font-weight:600}.chip div{margin-top:6px;font-weight:800;font-size:15px;display:flex;justify-content:space-between}
.up{color:#c6ff3d}.dn{color:#ff6b9a}
.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}
.list{background:#121217;border-radius:32px;padding:14px}
.tabs{display:flex;gap:8px;margin:4px 4px 12px}.tab{padding:8px 16px;border-radius:99px;background:#1c1c24;font-size:13px;font-weight:700;color:#9a9aa6}.tab.on{background:#c6ff3d;color:#0b0b0f}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:22px}.row.on{background:#1c1c24}
.fl{width:42px;height:42px;border-radius:50%;background:#262630;display:grid;place-items:center;font-size:22px}
.row .m{flex:1;min-width:0}.row b{display:block;font-size:15px;font-weight:800}.row small{color:#7d7d89;font-size:12px}
.row .p{text-align:right;font-weight:800;font-size:15px}.pill{display:inline-block;margin-top:3px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:800}.pill.up{background:#c6ff3d22}.pill.dn{background:#ff6b9a22}
.hero{background:#121217;border-radius:32px;padding:30px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-120px;top:-120px;width:380px;height:380px;border-radius:50%;background:radial-gradient(#ff6b9a55,transparent 70%)}
.big-fl{font-size:34px}.name{font-size:15px;color:#9a9aa6;font-weight:700;margin-top:6px}
.price{font-size:76px;font-weight:900;letter-spacing:-.05em;line-height:1;margin:10px 0}
.badge{display:inline-block;padding:7px 14px;border-radius:99px;background:#ff6b9a26;color:#ff6b9a;font-weight:800;font-size:15px}
.ranges{display:flex;gap:8px;margin:22px 0 4px;position:relative}.ranges span{padding:9px 16px;border-radius:99px;background:#1c1c24;font-size:13px;font-weight:800;color:#9a9aa6}.ranges .on{background:#fff;color:#0b0b0f}
svg.big{width:100%;height:290px;position:relative}
</style>
<div class="top"><span class="logo">watcher<i>.</i></span><div class="search">Search any stock, coin, index…</div><div class="av"></div></div>
<div class="chips" id="chips"></div>
<div class="grid"><div class="list"><div class="tabs"><span class="tab on">Global</span><span class="tab">Macro</span><span class="tab">＋</span></div><div id="rows"></div></div>
<div class="hero"><div class="big-fl">🇺🇸</div><div class="name">Apple Inc. · AAPL</div><div class="price">342.94</div><span class="badge">▼ 0.15% today</span>
<div class="ranges"><span class="on">1D</span><span>1W</span><span>1M</span><span>1Y</span><span>YTD</span><span>5Y</span><span>MAX</span></div>
<svg class="big" id="big" viewBox="0 0 800 290" preserveAspectRatio="none"></svg></div></div>
<script src="shared.js"></script><script>
chips.innerHTML=INDEX.map((i,k)=>`<div class="chip"><small>${IFLAG[k]} ${i[0]}</small><div><span>${i[1]}</span><span class="${i[2]>0?'up':'dn'}">${sgn(i[2])}</span></div></div>`).join('');
rows.innerHTML=WATCH.map((w,i)=>`<div class="row ${i?'':'on'}"><div class="fl">${FLAG[w.sym]}</div><div class="m"><b>${w.sym}</b><small>${w.name}</small></div><div class="p">${fmt(w.price)}<br><span class="pill ${w.pct>=0?'up':'dn'}">${sgn(w.pct)}</span></div></div>`).join('');
const p=path(series(3,120,-.02),800,290,16);big.innerHTML=`<defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff6b9a" stop-opacity=".3"/><stop offset="1" stop-color="#ff6b9a" stop-opacity="0"/></linearGradient></defs><path d="${p}L800,290L0,290Z" fill="url(#g)"/><path d="${p}" fill="none" stroke="#ff6b9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
</script>
