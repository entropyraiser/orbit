<!doctype html><meta charset="utf-8"><title>C · Terminal Pro</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:ui-sans-serif,-apple-system,Inter,sans-serif;background:#0a0a0b;color:#e7e5df;min-height:100vh;padding:14px;font-size:13px}
.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:16px;padding:6px 10px 12px;border-bottom:1px solid #26262a}
.top b{color:#ffb020;letter-spacing:.2em;font-size:13px}.top .s{margin-left:auto;border:1px solid #2c2c31;padding:6px 14px;color:#76757a;width:340px;border-radius:6px}
.tape{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #26262a}.tape div{padding:10px 12px;border-right:1px solid #26262a}.tape small{color:#76757a;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;display:block}
.up{color:#3ddc84}.dn{color:#ff5c5c}
.grid{display:grid;grid-template-columns:420px 1fr;height:calc(100vh - 150px);min-height:600px}
.left{border-right:1px solid #26262a}
.hd,.row{display:grid;grid-template-columns:1.1fr 70px 90px 74px;align-items:center;padding:9px 12px;gap:8px}
.hd{color:#76757a;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid #26262a}.hd span:nth-child(n+3),.row .n{text-align:right}
.row{border-bottom:1px solid #1a1a1d}.row.on{background:#ffb02014;box-shadow:inset 2px 0 #ffb020}
.row b{display:block}.row small{color:#76757a;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pill{display:inline-block;padding:2px 7px;border-radius:4px;font-size:12px}.pill.up{background:#3ddc8420}.pill.dn{background:#ff5c5c20}
.right{padding:18px 24px}
h1{font-size:20px;font-weight:600}.price{font-size:54px;margin:8px 0;letter-spacing:-.02em}
.ranges{display:flex;gap:2px;margin:10px 0}.ranges span{padding:5px 12px;border:1px solid #26262a;color:#76757a;font-size:11.5px}.ranges .on{background:#ffb020;color:#000;border-color:#ffb020;font-weight:600}
svg.big{width:100%;height:300px;border:1px solid #1a1a1d;background:repeating-linear-gradient(0deg,transparent 0 59px,#17171a 59px 60px)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#26262a;border:1px solid #26262a;margin-top:12px}.stats div{background:#0a0a0b;padding:10px 12px;color:#76757a;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}.stats b{display:block;color:#e7e5df;font-size:14px;margin-top:3px;text-transform:none;letter-spacing:0;font-weight:500}
</style>
<div class="top"><b>WATCHER</b><span style="color:#76757a" class="mono">20 OCT 2026 · 16:26 IST</span><div class="s mono">/ search symbol or name</div></div>
<div class="tape mono" id="tape"></div>
<div class="grid"><div class="left"><div class="hd"><span>Symbol</span><span>1D</span><span>Last</span><span>Chg %</span></div><div id="rows"></div></div>
<div class="right"><div style="color:#76757a;font-size:11px;letter-spacing:.08em">NASDAQ · EQUITY · PRE-MARKET</div><h1>AAPL — Apple Inc.</h1><div class="price mono">342.94</div><div class="dn mono">−0.52 &nbsp;−0.15%</div>
<div class="ranges mono"><span class="on">1D</span><span>1W</span><span>1M</span><span>1Y</span><span>YTD</span><span>5Y</span><span>MAX</span></div>
<svg class="big" id="big" viewBox="0 0 800 300" preserveAspectRatio="none"></svg>
<div class="stats mono"><div>Open<b>340.98</b></div><div>Day range<b>340.1 – 346.0</b></div><div>52-wk range<b>243 – 348</b></div><div>Mkt cap<b>5.00T</b></div></div></div></div>
<script src="shared.js"></script><script>
tape.innerHTML=INDEX.map(i=>`<div><small>${i[0]}</small>${i[1]} <span class="${i[2]>0?'up':'dn'}">${sgn(i[2])}</span></div>`).join('');
rows.innerHTML=WATCH.map((w,i)=>{const c=w.pct>=0?'#3ddc84':'#ff5c5c';return`<div class="row ${i?'':'on'}"><div><b>${w.sym}</b><small>${w.name}</small></div><svg width="70" height="22"><path d="${path(series(w.seed,50,w.d),70,22,2)}" fill="none" stroke="${c}" stroke-width="1.2"/></svg><div class="n mono">${fmt(w.price)}</div><div class="n"><span class="pill mono ${w.pct>=0?'up':'dn'}">${sgn(w.pct)}</span></div></div>`}).join('');
const s=series(3,120,-.02),p=path(s,800,300,20);big.innerHTML=`<path d="${p}L800,300L0,300Z" fill="#ff5c5c12"/><path d="${p}" fill="none" stroke="#ff5c5c" stroke-width="1.6"/>`;
</script>
