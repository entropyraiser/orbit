<!doctype html><meta charset="utf-8"><title>F · Neo-Brutal Pop</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:"Space Grotesk","SF Pro Display",ui-sans-serif,-apple-system,Inter,sans-serif;background:#ffe14d;color:#111;padding:22px;min-height:100vh}
.bx{border:3px solid #111;box-shadow:5px 5px 0 #111;background:#fff;border-radius:18px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}.logo{font-weight:900;font-size:24px;letter-spacing:-.04em;background:#ff6bd6;padding:4px 14px;transform:rotate(-2deg)}
.search{margin-left:auto;padding:11px 18px;font-weight:600;width:330px;color:#555}
.chips{display:flex;gap:12px;margin-bottom:20px;overflow:hidden}.chip{padding:10px 14px;min-width:150px;font-weight:700}.chip small{display:block;font-size:12px}.chip b{font-size:16px}
.up{color:#00a85a}.dn{color:#ff3b30}
.grid{display:grid;grid-template-columns:350px 1fr;gap:20px}
.list{padding:14px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{border:3px solid #111;border-radius:99px;padding:5px 14px;font-weight:800;font-size:13px}.tab.on{background:#111;color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:3px solid transparent}.row.on{border-color:#111;background:#b9f; box-shadow:3px 3px 0 #111}
.fl{font-size:24px}.row .m{flex:1;min-width:0}.row b{display:block;font-weight:800}.row small{font-size:12px;color:#444}.row .p{text-align:right;font-weight:800}
.pill{display:inline-block;border:2px solid #111;border-radius:99px;padding:0 8px;font-size:12px;font-weight:800;background:#b4ff9a}.pill.dn2{background:#ffb0b0}
.hero{padding:26px}.price{font-size:84px;font-weight:900;letter-spacing:-.06em;line-height:1;margin:8px 0}
.stk{display:inline-block;background:#ffb0b0;border:3px solid #111;border-radius:99px;padding:5px 14px;font-weight:900;transform:rotate(-1.5deg)}
.ranges{display:flex;gap:8px;margin:20px 0}.ranges span{border:3px solid #111;border-radius:12px;padding:6px 14px;font-weight:800;font-size:13px;background:#fff}.ranges .on{background:#4de1ff;box-shadow:3px 3px 0 #111}
svg.big{width:100%;height:260px;border:3px solid #111;border-radius:14px;background:#fffdf0}
</style>
<div class="top"><span class="logo bx" style="box-shadow:3px 3px 0 #111">WATCHER</span><div class="search bx">🔍 search anything…</div></div>
<div class="chips" id="chips"></div>
<div class="grid"><div class="list bx"><div class="tabs"><span class="tab on">Global</span><span class="tab">Macro</span><span class="tab">＋</span></div><div id="rows"></div></div>
<div class="hero bx"><div style="font-weight:800;font-size:16px">🇺🇸 Apple Inc. · AAPL</div><div class="price">342.94</div><span class="stk">▼ 0.15% today</span>
<div class="ranges"><span class="on">1D</span><span>1W</span><span>1M</span><span>1Y</span><span>YTD</span><span>5Y</span><span>MAX</span></div>
<svg class="big" id="big" viewBox="0 0 800 260" preserveAspectRatio="none"></svg></div></div>
<script src="shared.js"></script><script>
const bg=['#b9f','#4de1ff','#b4ff9a','#ffb0b0','#fff','#4de1ff','#b9f'];
chips.innerHTML=INDEX.map((i,k)=>`<div class="chip bx" style="background:${i[2]>0?'#b4ff9a':'#ffb0b0'}"><small>${IFLAG[k]} ${i[0]}</small><b>${i[1]}</b> <small>${sgn(i[2])}</small></div>`).join('');
rows.innerHTML=WATCH.map((w,i)=>`<div class="row ${i?'':'on'}"><div class="fl">${FLAG[w.sym]}</div><div class="m"><b>${w.sym}</b><small>${w.name}</small></div><div class="p">${fmt(w.price)}<br><span class="pill ${w.pct>=0?'':'dn2'}">${sgn(w.pct)}</span></div></div>`).join('');
const p=path(series(3,120,-.02),800,260,16);big.innerHTML=`<path d="${p}" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="${p}" fill="none" stroke="#ff3b30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
</script>
