<!doctype html><meta charset="utf-8"><title>E · Pastel Bento</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:"SF Pro Rounded",ui-rounded,ui-sans-serif,-apple-system,Inter,sans-serif;background:#eeeaff;color:#1d1736;padding:22px;min-height:100vh}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.logo{font-weight:900;font-size:22px;letter-spacing:-.03em}.logo span{background:#1d1736;color:#fff;border-radius:12px;padding:2px 9px;margin-right:6px}
.search{margin-left:auto;background:#fff;border-radius:99px;padding:11px 22px;color:#8a82ad;font-size:14px;width:320px;box-shadow:0 2px 0 #d9d2ff}
.bento{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:78px;gap:14px}
.t{border-radius:28px;padding:18px;position:relative;overflow:hidden}
.hero{grid-column:span 8;grid-row:span 5;background:#fff;box-shadow:0 3px 0 #d9d2ff}
.list{grid-column:span 4;grid-row:span 7;background:#fff;box-shadow:0 3px 0 #d9d2ff;padding:14px;overflow:hidden}
.idx{grid-column:span 2;grid-row:span 1;display:flex;flex-direction:column;justify-content:center;padding:10px 16px}.idx small{font-weight:700;font-size:12px;opacity:.7}.idx b{font-size:17px}
.c1{background:#c9f7d9}.c2{background:#ffd9e6}.c3{background:#ffe9b8}.c4{background:#cfe6ff}
.stats{grid-column:span 8;grid-row:span 1;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0;background:none}.stats div{border-radius:22px;padding:12px 16px;font-size:12px;font-weight:700;opacity:1}.stats b{display:block;font-size:18px;margin-top:2px}
.up{color:#0a8f4d}.dn{color:#e0245e}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tab{padding:7px 15px;border-radius:99px;background:#f3f0ff;font-weight:800;font-size:13px;color:#8a82ad}.tab.on{background:#1d1736;color:#fff}
.row{display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:18px}.row.on{background:#f3f0ff}
.fl{width:38px;height:38px;border-radius:14px;background:#f3f0ff;display:grid;place-items:center;font-size:20px}.row.on .fl{background:#fff}
.row .m{flex:1;min-width:0}.row b{display:block;font-size:14px;font-weight:800}.row small{color:#8a82ad;font-size:12px}.row .p{text-align:right;font-weight:800;font-size:14px}.row .p small{display:block;font-weight:800}
.price{font-size:68px;font-weight:900;letter-spacing:-.05em;line-height:1;margin:6px 0 8px}
.tag{display:inline-block;padding:6px 13px;border-radius:99px;background:#ffd9e6;color:#e0245e;font-weight:800;font-size:14px}
.ranges{position:absolute;right:18px;top:18px;display:flex;gap:4px;background:#f3f0ff;border-radius:99px;padding:4px}.ranges span{padding:7px 12px;border-radius:99px;font-weight:800;font-size:12px;color:#8a82ad}.ranges .on{background:#1d1736;color:#fff}
svg.big{position:absolute;left:0;right:0;bottom:0;width:100%;height:55%}
</style>
<div class="top"><span class="logo"><span>w</span>watcher</span><div class="search">Search stocks, coins, indices…</div></div>
<div class="bento">
<div class="t hero"><div style="font-weight:800;font-size:15px">🇺🇸 Apple <span style="color:#8a82ad">AAPL</span></div><div class="price">342.94</div><span class="tag">▼ 0.15% today</span>
<div class="ranges"><span class="on">1D</span><span>1W</span><span>1M</span><span>1Y</span><span>YTD</span><span>5Y</span><span>MAX</span></div>
<svg class="big" id="big" viewBox="0 0 800 220" preserveAspectRatio="none"></svg></div>
<div class="t list"><div class="tabs"><span class="tab on">Global</span><span class="tab">Macro</span><span class="tab">＋</span></div><div id="rows"></div></div>
<div id="idx" style="display:contents"></div>
<div class="stats"><div class="c4 t" style="border-radius:22px">Open<b>340.98</b></div><div class="c3 t" style="border-radius:22px">Day range<b>340–346</b></div><div class="c2 t" style="border-radius:22px">52-wk range<b>243–348</b></div><div class="c1 t" style="border-radius:22px">Mkt cap<b>5.00T</b></div></div>
</div>
<script src="shared.js"></script><script>
const cl=['c1','c4','c2','c3','c2','c2','c2'];
idx.innerHTML=INDEX.slice(0,6).map((i,k)=>`<div class="t idx ${i[2]>0?'c1':'c2'}"><small>${IFLAG[k]} ${i[0]}</small><b>${i[1]} <span class="${i[2]>0?'up':'dn'}" style="font-size:12px">${sgn(i[2])}</span></b></div>`).join('');
rows.innerHTML=WATCH.map((w,i)=>`<div class="row ${i?'':'on'}"><div class="fl">${FLAG[w.sym]}</div><div class="m"><b>${w.sym}</b><small>${w.name}</small></div><div class="p">${fmt(w.price)}<small class="${w.pct>=0?'up':'dn'}">${sgn(w.pct)}</small></div></div>`).join('');
const p=path(series(3,120,-.02),800,220,14);big.innerHTML=`<defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e0245e" stop-opacity=".22"/><stop offset="1" stop-color="#e0245e" stop-opacity="0"/></linearGradient></defs><path d="${p}L800,220L0,220Z" fill="url(#g)"/><path d="${p}" fill="none" stroke="#e0245e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
</script>
